name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  TF_VERSION: "1.7.5"
  NODE_VERSION: "20"

jobs:
  # ── 1. Test ────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Lint (advisory)
        run: npm run lint --if-present || true

      - name: Run tests
        run: npm test --if-present || true

  # ── 2. Build & upload artifact ────────────────────────────────────────────
  build:
    name: Build & Upload Artifact
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package application (exclude node_modules)
        run: |
          zip -r app.zip . \
            --exclude "node_modules/*" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "terraform/*" \
            --exclude "ansible/*" \
            --exclude "*.zip"

      - name: Upload artifact to S3
        run: |
          aws s3 cp app.zip \
            s3://${{ secrets.TF_STATE_BUCKET }}/${{ secrets.PROJECT_NAME }}/app.zip \
            --region ${{ secrets.AWS_REGION }}

  # ── 3. Deploy via Terraform ───────────────────────────────────────────────
  deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    needs: build

    env:
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_tf_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Get ALB DNS name
        id: alb
        working-directory: terraform
        run: |
          ALB_DNS=$(terraform output -raw alb_dns_name)
          echo "alb_dns=${ALB_DNS}" >> "$GITHUB_OUTPUT"

      - name: Wait for EC2 bootstrap and PM2 startup
        run: |
          echo "Waiting 3 minutes for EC2 user-data to complete..."
          sleep 180

      - name: Smoke test — health endpoint
        run: |-
          ALB_URL="http://${{ steps.alb.outputs.alb_dns }}"
          echo "Smoke-testing: ${ALB_URL}/health"

          MAX_RETRIES=20
          RETRY_INTERVAL=30
          HTTP_STATUS=0

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt ${i}/${MAX_RETRIES}..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 \
              "${ALB_URL}/health" || echo "000")

            if [[ "$HTTP_STATUS" =~ ^[23] ]]; then
              echo "✅ Smoke test passed — HTTP ${HTTP_STATUS}"
              exit 0
            fi

            echo "  Got HTTP ${HTTP_STATUS}, retrying in ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done

          echo "❌ Smoke test FAILED after ${MAX_RETRIES} attempts. Last status: ${HTTP_STATUS}"
          exit 1