name: Deploy

on:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # TEST
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter (advisory)
        run: npm run lint || true
        continue-on-error: true

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------------------
  # BUILD
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Create deployment archive
        run: |
          tar -czf app.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='*.test.js' \
            --exclude='*.spec.js' \
            --exclude='.github' \
            --exclude='terraform' \
            --exclude='ansible' \
            .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload archive to S3
        run: |
          aws s3 cp app.tar.gz \
            s3://${{ secrets.TF_STATE_BUCKET }}/${{ secrets.PROJECT_NAME }}/app.tar.gz

  # ---------------------------------------------------------------------------
  # DEPLOY
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Generate SSH key pair
        run: |
          ssh-keygen -t rsa -b 4096 -f ~/.ssh/deploy_key -N ""
          echo "SSH key pair generated"

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      - name: Terraform apply
        id: tf_apply
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          terraform apply -auto-approve \
            -var="public_key=$(cat ~/.ssh/deploy_key.pub)" \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}"

      - name: Capture Terraform outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          echo "ec2_ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
          echo "rds_host=$(terraform output -raw rds_host)" >> $GITHUB_OUTPUT
          echo "rds_port=$(terraform output -raw rds_port)" >> $GITHUB_OUTPUT
          echo "rds_db_name=$(terraform output -raw rds_db_name)" >> $GITHUB_OUTPUT

      - name: Wait for EC2 SSH to become available
        run: |
          SERVER_IP="${{ steps.tf_outputs.outputs.ec2_ip }}"
          echo "Waiting for SSH on $SERVER_IP ..."
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no \
                   -o ConnectTimeout=5 \
                   -i ~/.ssh/deploy_key \
                   ec2-user@"$SERVER_IP" "echo ready" 2>/dev/null; then
              echo "SSH is available"
              exit 0
            fi
            echo "Attempt $i/30 failed, retrying in 10s..."
            sleep 10
          done
          echo "ERROR: SSH did not become available after 300s"
          exit 1

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip3 install ansible

      - name: Download app archive from S3
        run: |
          aws s3 cp \
            s3://${{ secrets.TF_STATE_BUCKET }}/${{ secrets.PROJECT_NAME }}/app.tar.gz \
            /tmp/app.tar.gz

      - name: Run Ansible playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          SERVER_IP: ${{ steps.tf_outputs.outputs.ec2_ip }}
          RDS_HOST: ${{ steps.tf_outputs.outputs.rds_host }}
          RDS_PORT: ${{ steps.tf_outputs.outputs.rds_port }}
          RDS_DB_NAME: ${{ steps.tf_outputs.outputs.rds_db_name }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ansible-playbook \
            -i "$SERVER_IP," \
            -u ec2-user \
            --private-key ~/.ssh/deploy_key \
            ansible/playbook.yml \
            --extra-vars "db_host=${RDS_HOST} db_port=${RDS_PORT} db_name=${RDS_DB_NAME} db_user=${DB_USER} db_password=${DB_PASSWORD} app_archive=/tmp/app.tar.gz"

      - name: Self-verify — health check
        run: |
          SERVER_IP="${{ steps.tf_outputs.outputs.ec2_ip }}"
          echo "Running health check against http://$SERVER_IP/health ..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              "http://$SERVER_IP/health" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if echo "$STATUS" | grep -qE '^[23]'; then
              echo "Health check passed with HTTP $STATUS"
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: Health check failed — app did not return 2xx/3xx after 120s"
          exit 1

      - name: Terraform destroy (on failure)
        if: failure()
        working-directory: terraform
        run: |-
          terraform destroy -auto-approve \
            -var="public_key=$(cat ~/.ssh/deploy_key.pub)" \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}"
