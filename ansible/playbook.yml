---
- name: Configure EC2 and deploy Node.js application
  hosts: all
  become: true
  gather_facts: true

  vars:
    app_dir: /opt/app
    app_user: ec2-user
    node_version: "20"
    # These vars are expected to be passed via --extra-vars
    db_host: ""
    db_port: "5432"
    db_name: ""
    db_user: ""
    db_password: ""
    app_archive: "/tmp/app.tar.gz"

  tasks:
    # -------------------------------------------------------------------------
    # System packages
    # -------------------------------------------------------------------------
    - name: Update all system packages
      dnf:
        name: "*"
        state: latest
        update_only: true
      async: 300
      poll: 10

    - name: Install required system packages
      dnf:
        name:
          - git
          - curl
          - tar
          - nginx
          - python3
        state: present

    # -------------------------------------------------------------------------
    # Node.js 20 via NodeSource
    # -------------------------------------------------------------------------
    - name: Check if Node.js 20 is already installed
      command: node --version
      register: node_check
      changed_when: false
      failed_when: false

    - name: Download NodeSource setup script for Node.js 20
      get_url:
        url: https://rpm.nodesource.com/setup_20.x
        dest: /tmp/nodesource_setup.sh
        mode: "0755"
      when: node_check.rc != 0 or not node_check.stdout is search('v20\.')

    - name: Run NodeSource setup script
      command: bash /tmp/nodesource_setup.sh
      when: node_check.rc != 0 or not node_check.stdout is search('v20\.')

    - name: Install Node.js 20
      dnf:
        name: nodejs
        state: present
      when: node_check.rc != 0 or not node_check.stdout is search('v20\.')

    - name: Verify Node.js version
      command: node --version
      register: node_version_out
      changed_when: false

    - name: Display Node.js version
      debug:
        msg: "Node.js version: {{ node_version_out.stdout }}"

    - name: Install PM2 globally
      npm:
        name: pm2
        global: true
        state: present

    # -------------------------------------------------------------------------
    # Application directory
    # -------------------------------------------------------------------------
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Check if app archive exists locally on runner
      stat:
        path: "{{ app_archive }}"
      register: archive_stat
      delegate_to: localhost
      become: false

    - name: Copy application archive to server
      copy:
        src: "{{ app_archive }}"
        dest: /tmp/app.tar.gz
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
      when: archive_stat.stat.exists

    - name: Extract application archive
      unarchive:
        src: /tmp/app.tar.gz
        dest: "{{ app_dir }}"
        remote_src: true
        owner: "{{ app_user }}"
        group: "{{ app_user }}"

    - name: Install Node.js production dependencies
      npm:
        path: "{{ app_dir }}"
        production: true
        state: present
      become_user: "{{ app_user }}"

    # -------------------------------------------------------------------------
    # Write .env file via shell (never via copy: with content:)
    # -------------------------------------------------------------------------
    - name: Write .env file
      shell: |
        cat > {{ app_dir }}/.env << 'ENVEOF'
        NODE_ENV=production
        PORT=3000
        DB_HOST={{ db_host }}
        DB_PORT=5432
        DB_NAME={{ db_name }}
        DB_USER={{ db_user }}
        DB_PASSWORD={{ db_password }}
        ENVEOF
        chmod 600 {{ app_dir }}/.env
        chown {{ app_user }}:{{ app_user }} {{ app_dir }}/.env
      args:
        executable: /bin/bash
      no_log: true

    # -------------------------------------------------------------------------
    # PM2 — start/restart the application
    # -------------------------------------------------------------------------
    - name: Stop existing PM2 app (if running)
      shell: |
        su - {{ app_user }} -c "pm2 stop app 2>/dev/null || true"
        su - {{ app_user }} -c "pm2 delete app 2>/dev/null || true"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Start application with PM2 using npm start
      shell: |
        cd {{ app_dir }}
        su - {{ app_user }} -c "cd {{ app_dir }} && pm2 start npm --name app -- start --update-env"
      args:
        executable: /bin/bash

    - name: Save PM2 process list
      shell: |
        su - {{ app_user }} -c "pm2 save"
      args:
        executable: /bin/bash

    - name: Configure PM2 startup on boot
      shell: |
        pm2 startup systemd -u {{ app_user }} --hp /home/{{ app_user }}
        systemctl enable pm2-{{ app_user }}
      args:
        executable: /bin/bash
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Nginx configuration — proxy port 80 -> 127.0.0.1:3000
    # -------------------------------------------------------------------------
    - name: Write Nginx configuration
      shell: |
        cat > /etc/nginx/conf.d/app.conf << 'NGINXEOF'
        server {
            listen 80;
            server_name _;

            location / {
                proxy_pass         http://127.0.0.1:3000;
                proxy_http_version 1.1;
                proxy_set_header   Upgrade $http_upgrade;
                proxy_set_header   Connection 'upgrade';
                proxy_set_header   Host $host;
                proxy_set_header   X-Real-IP $remote_addr;
                proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header   X-Forwarded-Proto $scheme;
                proxy_cache_bypass $http_upgrade;
                proxy_read_timeout 90s;
            }
        }
        NGINXEOF
      args:
        executable: /bin/bash

    - name: Remove default Nginx server block (if present)
      file:
        path: /etc/nginx/conf.d/default.conf
        state: absent

    - name: Validate Nginx configuration
      command: nginx -t
      changed_when: false

    - name: Enable and start Nginx
      systemd:
        name: nginx
        enabled: true
        state: restarted
        daemon_reload: true

    # -------------------------------------------------------------------------
    # Wait for the application to be healthy
    # -------------------------------------------------------------------------
    - name: Wait for application to respond on port 3000 (internal)
      wait_for:
        host: 127.0.0.1
        port: 3000
        delay: 5
        timeout: 60
        state: started

    - name: Verify app health endpoint via Nginx (port 80)
      uri:
        url: "http://127.0.0.1:80/health"
        method: GET
        status_code: [200, 201, 202, 204]
        timeout: 15
      retries: 6
      delay: 10
      register: health_result

    - name: Display health check result
      debug:
        msg: "Health check response: {{ health_result.status }} — app is running"